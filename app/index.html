<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔭</text></svg>">
    <title>AstroViewer</title>
  </head>
  <body class="bg-slate-900 text-white flex flex-col items-center justify-center min-h-screen p-4 transition-colors duration-500 overflow-x-hidden">
    
    <div class="max-w-6xl w-full text-center space-y-6 mb-8">
      
      <div class="flex justify-end w-full">
        <button id="toggle-mode" class="flex items-center gap-2 px-4 py-2 bg-slate-800 rounded-full text-xs font-bold uppercase tracking-widest hover:bg-slate-700 border border-slate-700 transition-all text-slate-300">
          🔴 Modo Noturno
        </button>
      </div>

      <form id="search-form" class="flex gap-2 w-full">
        <input 
          type="text" 
          id="city-input" 
          placeholder="Digite uma cidade (ex: Tóquio)" 
          class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-colors"
        />
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-5 rounded-lg font-bold transition-colors shadow-lg shadow-blue-900/20">
          🔍
        </button>
      </form>

      <div>
        <h1 class="text-4xl font-bold text-blue-400 mb-1 tracking-tight">AstroViewer</h1>
        <p id="city-display" class="text-lg text-slate-300 font-medium">São Paulo, Brazil</p>
      </div>
      
      <div id="app" class="bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700 min-h-[400px] flex flex-col justify-center">
        <div class="animate-pulse flex flex-col items-center">
          <div class="h-4 bg-slate-700 rounded w-3/4 mb-4"></div>
          <div class="h-10 bg-slate-700 rounded w-1/2 mb-4"></div>
          <p class="text-slate-500 mt-4 text-sm">Aguardando dados...</p>
        </div>
      </div>

      <p class="text-[10px] text-slate-600 uppercase tracking-widest">Dados via Open-Meteo & OpenAQ</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
