<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔭</text></svg>">
    <title>AstroView 🔭</title>
  </head>
  <body class="bg-slate-900 text-white h-screen w-screen overflow-hidden flex flex-col items-center p-6 transition-colors duration-500 selection:bg-blue-500 selection:text-white">
    
    <div class="max-w-7xl w-full h-full flex flex-col gap-6">
      
      <div class="flex flex-col md:flex-row justify-between items-start gap-6 shrink-0">
        
        <div class="text-left space-y-2">
          <h1 class="text-4xl md:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-400 tracking-tight">
            AstroView
          </h1>
          <p class="text-slate-400 text-sm md:text-base max-w-xl leading-relaxed">
            Inteligência atmosférica em tempo real. Score de visibilidade astronômica baseado em clima, poluição e fases da lua.
          </p>
        </div>

        <div class="flex flex-col items-end gap-3 w-full md:w-auto">
          <button id="toggle-mode" class="px-4 py-1.5 bg-slate-800 rounded-full text-xs font-bold uppercase tracking-widest hover:bg-slate-700 border border-slate-700 text-slate-300 shadow-sm transition-all">
            🔴 Modo Noturno
          </button>
          
          <form id="search-form" class="flex gap-2 w-full md:w-96 relative group">
            <input 
              type="text" 
              id="city-input" 
              placeholder="Digite a cidade (ex: Campos do Jordão)" 
              class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-base text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-all shadow-md"
            />
            <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-5 rounded-xl font-bold transition-all shadow-lg active:scale-95 text-lg">
              🔍
            </button>
          </form>
          <p id="city-display" class="text-xs text-slate-500 font-bold uppercase tracking-widest text-right w-full pr-1">
            -- Selecione um local --
          </p>
        </div>
      </div>
      
      <div id="app" class="bg-slate-800 rounded-3xl shadow-2xl border border-slate-700 flex-1 w-full overflow-hidden relative backdrop-blur-sm bg-opacity-95">
        <div class="h-full w-full flex flex-col items-center justify-center animate-pulse gap-3">
          <div class="h-6 bg-slate-700 rounded w-64"></div>
          <div class="h-12 bg-slate-700 rounded w-32"></div>
          <p class="text-slate-500 text-sm font-medium">Conectando ao satélite...</p>
        </div>
      </div>

      <div class="text-center shrink-0 pb-2">
        <p class="text-[10px] text-slate-500 uppercase tracking-widest font-semibold">
          Powered by Open-Meteo • OpenAQ
        </p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
